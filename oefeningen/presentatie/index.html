# Feetjes Wereld

### Een kijkje in mijn brein

Een digitale wereld vol gedachten, herinneringen en verhalen.

Fé van Santen
---

# Agenda

1. Onderwerp: Feetjes Wereld
2. 10 inspiratiebronnen
3. 50 inspiratieafbeeldingen
4. Patronen in mijn onderzoek
5. Mijn eerste concept
6. Introtekst

---

# Onderwerp

Feetjes Wereld wordt een soort open dagboek waarin ik alles kan verzamelen wat mij bezighoudt of verwondert.

Van herinneringen en persoonlijke gedachten tot grappige nieuwsartikelen, muziek, dingen die ik op social media tegenkom of gewoon iets wat ik leuk vind.

Ik wil dit vormgeven als een groot flatgebouw met allemaal kleine kamers, waarin achter ieder raam weer iets anders te ontdekken valt.
---

# 10 inspiratiebronnen (1/2)

1. [WINDOWS // NYC](https://windows.davekrugman.com)  
   Inspiratie voor een gebouw met allemaal verschillende ramen.

2. [Builtloop](https://builtloop.in)  
   Het ontdekken van verschillende ruimtes in een gebouw.

3. [Genius Loci: Home](https://palekirill.github.io/genius-loci-home/)  
   Een interactieve omgeving waarin je zelf dingen ontdekt.

4. [Zoomquilt](https://zzz.zoomquilt.org/)  
   Een eindeloze wereld waarin je steeds verder kunt kijken.

5. [Guerrilla Design](https://guerrilladesign.framer.website/page-3)  
   Inspiratie voor bijzondere vormgeving en interactie.

---

# 10 inspiratiebronnen (2/2)

6. [Romain Avalle](https://romainavalle.dev)  
   Inspiratie voor animaties en een speelse website.

7. [Hemu Ski](https://eric1hua.github.io/hemu-ski/)  
   Zelf bewegen en ontdekken in een digitale wereld.

8. [Josh Kern](https://webdesign.kernjosh.com)  
   Inspiratie voor creatieve webdesignexperimenten.

9. [Véras Fawaz](https://www.verasfawaz.com)  
   Een persoonlijke website met interactieve elementen.

10. [WindowSwap](https://www.window-swap.com/)  
    Via een raam een kijkje nemen in een andere wereld.

# Patronen in mijn onderzoek

In mijn inspiratieafbeeldingen zie ik 3 dingen steeds terug:

1. **Persoonlijke verhalen:** websites die voelen als een dagboek, waarin je iemands gedachten en herinneringen ontdekt.

2. **Illustraties:** speelse tekeningen die een website persoonlijker maken en verhalen op een creatieve manier laten zien.

3. **Ruimtes en ontdekkingen:** gebouwen, kamers en ramen waarachter steeds iets nieuws te ontdekken valt.

Deze drie dingen wil ik combineren in mijn eigen digital garden.

---

# Mijn eerste concept

Ik wil mijn digital garden vormgeven als een groot geïllustreerd flatgebouw.

- Achter ieder raam zit een ander verhaal, een herinnering of iets wat mij bezighoudt.
- Bezoekers kunnen op de ramen klikken om verschillende kamers te ontdekken.
- Iedere kamer krijgt een eigen inhoud, bijvoorbeeld muziek, foto's, nieuws of persoonlijke gedachten.
- Het gebouw blijft groeien, omdat ik steeds nieuwe dingen kan toevoegen.


---

# Mijn verhaal vertellen

Ik wil mijn eigen verhalen combineren met dingen die ik ergens anders tegenkom.

**Eigen content:** herinneringen, gedachten, foto's en illustraties die ik zelf maak.

**Andere content:** nieuwsartikelen, muziek, video's, socialmediaberichten en links die ik interessant vind.

Zo wordt Feetjes Wereld een verzameling van alles wat mij bezighoudt.
